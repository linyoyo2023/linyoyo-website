<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1080" role="img" aria-labelledby="title desc">
  <title id="title">林友友候選人照片預留位置</title>
  <desc id="desc">請將候選人照片命名為 candidate.jpg 放入 images 資料夾。</desc>
  <rect width="840" height="1080" fill="#f8dce1"/>
  <circle cx="420" cy="870" r="390" fill="#f19ca6" opacity=".82"/>
  <circle cx="650" cy="220" r="250" fill="none" stroke="#b94762" stroke-opacity=".18" stroke-width="3"/>
  <g fill="#7c2f43" text-anchor="middle" font-family="PingFang TC, Microsoft JhengHei, sans-serif">
    <text x="420" y="440" font-size="180" font-weight="700">友</text>
    <text x="420" y="545" font-size="42" font-weight="700" letter-spacing="12">林友友</text>
  </g>
  <g transform="translate(190 625)">
    <rect width="460" height="92" rx="46" fill="#fffaf8" fill-opacity=".9"/>
    <text x="230" y="59" fill="#3b252c" text-anchor="middle" font-family="PingFang TC, Microsoft JhengHei, sans-serif" font-size="27" font-weight="700">請放入候選人照片</text>
  </g>
</svg>
